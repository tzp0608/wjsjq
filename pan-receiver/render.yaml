services:
  - type: web
    name: pan-receiver-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd backend && cp prisma/schema.postgresql.prisma prisma/schema.prisma && npm install --include=dev && DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder" npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        fromService:
          name: pan-receiver-api
          type: web
          property: host
      - key: APP_PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: pan-receiver-db
          property: connectionString
      - key: REDIS_URL
        value: memory
      - key: WECHAT_APP_ID
        sync: false
      - key: WECHAT_APP_SECRET
        sync: false
      - key: BAIDU_APP_KEY
        sync: false
      - key: BAIDU_APP_SECRET
        sync: false
      - key: BAIDU_OAUTH_REDIRECT_URI
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: TEMP_FILE_DIR
        value: /tmp/pan-receiver
      - key: MAX_FILE_SIZE
        value: 524288000
      - key: MAX_FILE_COUNT_PER_SUBMISSION
        value: 20

databases:
  - name: pan-receiver-db
    plan: free
    region: singapore
